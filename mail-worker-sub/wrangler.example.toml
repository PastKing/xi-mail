name = "xi-mail-sub"
main = "src/index.js"
compatibility_date = "2025-06-04"

[[d1_databases]]
binding = "db"
database_name = "xi-mail-sub"
database_id = "<YOUR_D1_DATABASE_ID>"

[triggers]
crons = ["0 16 * * *"]

[vars]
api_token = "<YOUR_API_TOKEN_MIN_32_CHARS>"
domain = ["sub-domain.com"]
# 邮件保留天数，超过后由定时任务自动删除；0 或不配置表示永久保留
auto_clean_days = 0
