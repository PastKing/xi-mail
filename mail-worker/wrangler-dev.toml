name = "xi-mail-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[dev]
ip = "0.0.0.0"

[[d1_databases]]
binding = "db"

[[kv_namespaces]]
binding = "kv"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "xi-mail-dev"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true


[vars]
orm_log = false
admin = "admin@example.com"
# 使用 Cloudflare Secret 设置 jwt_secret 和 init_secret；本地开发值放入 .dev.vars。
