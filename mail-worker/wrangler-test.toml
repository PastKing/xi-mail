name = "xi-mail-test"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改

# 可选：需要时绑定 R2 存储。
#[[r2_buckets]]
#binding = "r2"			# R2 绑定名
#bucket_name = "xi-mail-test"	# R2 储存桶名称

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#定时任务每天晚上12点执行


[vars]
orm_log = false
admin = "admin@example.com"				#管理员的邮箱	示例: admin@example.com
# 使用 Cloudflare Secret 设置 jwt_secret 和 init_secret；本地开发值放入 .dev.vars。

[build]
command = "pnpm --prefix ../mail-view install && pnpm --prefix ../mail-view run build"
