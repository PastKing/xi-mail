name = "xi-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"

[[kv_namespaces]]
binding = "kv"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
orm_log = false
# admin 在 Worker 运行时变量中设置，也可在本地配置中填写。

# 首次部署时，将 jwt_secret 和 init_secret 设置为 Cloudflare Secret。
# 邮箱域名、OAuth、R2 存储和 Cloudflare Email 发件服务均可部署后再配置。

[build]
command = "pnpm --prefix ../mail-view install && pnpm --prefix ../mail-view run build"
